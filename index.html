<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Usage Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">EnergyMonitor Pro</h1>
        </div>
    </nav>

    <main class="container mx-auto py-8 px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Total Users</h3>
                <p id="total-users" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Total Consumption (kWh)</h3>
                <p id="total-usage" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Avg. Efficiency</h3>
                <p id="avg-usage" class="text-3xl font-bold text-gray-800">0%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-4">Usage Trends</h3>
                <canvas id="usageChart"></canvas>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md overflow-hidden">
                <h3 class="text-lg font-bold mb-4">User Details</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full leading-normal">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">User</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Consumption</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadDashboard() {
            try {
                // Fetching both JSON files
                const [usersRes, usageRes] = await Promise.all([
                    fetch('electricity_users_en.json'),
                    fetch('electricity_usages_en.json')
                ]);

                const users = await usersRes.json();
                const usages = await usageRes.json();

                renderStats(users, usages);
                renderChart(usages);
                renderTable(users, usages);

            } catch (error) {
                console.error("Error loading JSON data:", error);
                document.body.innerHTML += `<div class="text-red-500 text-center p-10">Check console: Ensure JSON files exist and are served via a local server.</div>`;
            }
        }

        function renderStats(users, usages) {
            const totalKwh = usages.reduce((sum, item) => sum + item.kilowatts, 0);
            document.getElementById('total-users').innerText = users.length;
            document.getElementById('total-usage').innerText = totalKwh.toLocaleString();
            document.getElementById('avg-usage').innerText = (totalKwh / users.length).toFixed(1);
        }

        function renderChart(usages) {
            const ctx = document.getElementById('usageChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: usages.map(u => u.month || 'User ' + u.userId),
                    datasets: [{
                        label: 'kWh Consumed',
                        data: usages.map(u => u.kilowatts),
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: 'rgb(59, 130, 246)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderTable(users, usages) {
            const tbody = document.getElementById('user-table-body');
            users.forEach(user => {
                const userUsage = usages.find(u => u.userId === user.id)?.kilowatts || 0;
                const row = `
                    <tr>
                        <td class="px-5 py-5 border-b border-gray-200 text-sm">
                            <p class="text-gray-900 whitespace-no-wrap font-bold">${user.name}</p>
                            <p class="text-gray-600 whitespace-no-wrap">${user.address || 'N/A'}</p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 text-sm">
                            <p class="text-gray-900 whitespace-no-wrap">${userUsage} kWh</p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 text-sm">
                            <span class="relative inline-block px-3 py-1 font-semibold text-green-900 leading-tight">
                                <span aria-hidden class="absolute inset-0 bg-green-200 opacity-50 rounded-full"></span>
                                <span class="relative">Active</span>
                            </span>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        loadDashboard();
    </script>
</body>
</html>
